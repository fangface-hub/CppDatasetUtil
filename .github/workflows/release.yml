name: Release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::VERSION must contain a single X.Y.Z version"
            exit 1
          fi
          tag="v$version"
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Selected tag does not match VERSION ($tag)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "::error::Tag $tag already points to a different commit"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  deb:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev
      - name: Build and verify DEB
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          make deb deb-cxx11
          make static
          make VARIANT=cxx11 static
          mkdir -p dist/static
          cp build/libcppdatasetutil.a build/libcppdatasetutil_cxx11.a dist/static/
          for package in dist/*.deb; do
            dpkg-deb --info "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: static-library
          path: dist/static/*.a
          if-no-files-found: error

  rpm:
    needs: prepare
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc gcc-c++ make rpm-build tar gzip git findutils
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build and verify RPM
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          make rpm rpm-cxx11
          rpm -qip dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Obtain HTML Help compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'htmlhelp.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'htmlhelp'
          # Microsoft no longer hosts this installer; use the archived original.
          $url = 'https://web.archive.org/web/20200918004813id_/https://download.microsoft.com/download/0/A/9/0A939EF6-E31C-430F-A3DF-DFAE7960D564/htmlhelp.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expected = 'B2B3140D42A818870C1AB13C1C7B8D4536F22BD994FA90AADE89729A6009A3AE'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'HTML Help installer checksum mismatch'
          }
          & "$env:ProgramFiles\7-Zip\7z.exe" e $installer hhc.exe hha.dll itcc.dll "-o$compiler" -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract HTML Help compiler' }
          if (-not (Test-Path (Join-Path $compiler 'hhc.exe'))) {
            throw 'HTML Help compiler was not extracted'
          }
      - name: Configure Windows build
        shell: pwsh
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 "-DHTML_HELP_COMPILER=$env:RUNNER_TEMP\htmlhelp\hhc.exe"
      - name: Build Windows DLL
        run: cmake --build build-windows --config Release --parallel 2
      - name: Test DLL consumer
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Build and verify Windows help
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --target windows_help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help = 'build-windows\help\CppDatasetUtil.chm'
          $listing = & "$env:ProgramFiles\7-Zip\7z.exe" l -slt $help
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect CHM' }
          foreach ($topic in @('index', 'en', 'ja', 'de', 'fr', 'it', 'ko', 'zh_CN')) {
            if ($listing -notcontains "Path = $topic.html") {
              throw "Missing CHM topic: $topic.html"
            }
          }
          & "$env:ProgramFiles\7-Zip\7z.exe" t $help
          if ($LASTEXITCODE -ne 0) { throw 'CHM integrity check failed' }
      - name: Prepare Windows release assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'cppdatasetutil-sdk'
          New-Item -ItemType Directory -Path windows-release, $sdk, "$sdk\licenses" | Out-Null
          Copy-Item build-windows\Release\cppdatasetutil.dll, build-windows\static\Release\cppdatasetutil.lib, build-windows\help\CppDatasetUtil.chm windows-release
          Copy-Item build-windows\Release\cppdatasetutil.dll, build-windows\Release\cppdatasetutil.lib, Include\cppdatasetutil.h, build-windows\help\CppDatasetUtil.chm $sdk
          New-Item -ItemType Directory -Path "$sdk\static" | Out-Null
          Copy-Item build-windows\static\Release\cppdatasetutil.lib "$sdk\static"
          Copy-Item LICENSE "$sdk\licenses\cppdatasetutil-LICENSE"
          Copy-Item third_party\json\LICENSE.MIT "$sdk\licenses\json-LICENSE"
          Copy-Item third_party\libyaml\License "$sdk\licenses\libyaml-LICENSE"
          Copy-Item third_party\toml11\LICENSE "$sdk\licenses\toml11-LICENSE"
          Copy-Item third_party\mpark_variant\LICENSE "$sdk\licenses\mpark-variant-LICENSE"
          Copy-Item third_party\ghc_filesystem\LICENSE "$sdk\licenses\ghc-filesystem-LICENSE"
          Copy-Item Include\cppdatasetutil "$sdk" -Recurse
          Compress-Archive -Path "$sdk\*" -DestinationPath "windows-release\cppdatasetutil-$env:PACKAGE_VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows-release/*
          if-no-files-found: error

  release:
    needs: [prepare, deb, rpm, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: packages/deb
      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: packages/rpm
      - uses: actions/download-artifact@v4
        with:
          name: static-library
          path: packages/static
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: packages/windows
      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to a different commit"
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi

          range="$RELEASE_COMMIT"
          if git rev-parse -q --verify "$RELEASE_COMMIT^" >/dev/null; then
            parent="$RELEASE_COMMIT^"
            if [[ -n "$(git tag --merged "$parent" --list 'v[0-9]*')" ]]; then
              previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$parent")
              range="$previous..$RELEASE_COMMIT"
            fi
          fi
          {
            echo "## Changes"
            echo
            git log --format='- %s (%h)' "$range"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" packages/deb/*.deb packages/rpm/*.rpm \
            packages/windows/cppdatasetutil.dll packages/windows/cppdatasetutil.lib \
            packages/windows/CppDatasetUtil.chm packages/static/*.a \
            packages/windows/*.zip \
            --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
